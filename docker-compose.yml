services:
  gateway:
    build:
      context: ./gateway
    container_name: pplos_gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8001
      FIELD_SERVICE_URL: http://field-service:8002
      BOOKING_SERVICE_URL: http://booking-service:8003
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
    depends_on:
      - auth-service
      - field-service
      - booking-service
    networks:
      - pplos_network

  auth-service:
    build:
      context: ./services/auth-service
    container_name: pplos_auth_service
    ports:
      - "8001:8001"
    environment:
      APP_NAME: SportFieldHub Auth Service
      APP_ENV: local
      APP_KEY: base64:change_this_after_key_generate
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_DATABASE: auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_password
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    depends_on:
      - auth-db
    networks:
      - pplos_network

  field-service:
    build:
      context: ./services/field-service
    container_name: pplos_field_service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DB_HOST: field-db
      DB_PORT: 3306
      DB_NAME: field_db
      DB_USER: field_user
      DB_PASSWORD: field_password
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      - field-db
    networks:
      - pplos_network

  booking-service:
    build:
      context: ./services/booking-service
    container_name: pplos_booking_service
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_HOST: booking-db
      DB_PORT: 3306
      DB_NAME: booking_db
      DB_USER: booking_user
      DB_PASSWORD: booking_password
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:8001
      FIELD_SERVICE_URL: http://field-service:8002
    depends_on:
      - booking-db
      - auth-service
      - field-service
    networks:
      - pplos_network

  auth-db:
    image: mysql:8.0
    container_name: pplos_auth_db
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "33061:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - pplos_network

  field-db:
    image: mysql:8.0
    container_name: pplos_field_db
    environment:
      MYSQL_DATABASE: field_db
      MYSQL_USER: field_user
      MYSQL_PASSWORD: field_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "33062:3306"
    volumes:
      - field_db_data:/var/lib/mysql
    networks:
      - pplos_network

  booking-db:
    image: mysql:8.0
    container_name: pplos_booking_db
    environment:
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "33063:3306"
    volumes:
      - booking_db_data:/var/lib/mysql
    networks:
      - pplos_network

networks:
  pplos_network:
    driver: bridge

volumes:
  auth_db_data:
  field_db_data:
  booking_db_data: